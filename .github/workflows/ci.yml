name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  leaks:
    # утечки личного и секретов не попадают в репозиторий
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/leak_scan.py

  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install -y ffmpeg

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest

  mcp-smoke:
    # живой диалог клиент↔сервер MCP по stdio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - name: MCP-смоук
        run: python scripts/mcp_smoke.py
